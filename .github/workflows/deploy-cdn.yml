name: Deploy CDN

on:
  push:
    branches: [main]
    paths: ['cdn/**']

# The job only calls the webhook; it needs no repository token
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger webhook
        env:
          # Passed via the environment so the secret is never spliced into the script text
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          SIGNATURE="sha256=$(echo -n '{}' | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | cut -d' ' -f2)"
          curl -sf -X POST https://audio.jkyl.io/webhook \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -H "Content-Type: application/json" \
            -d '{}'
